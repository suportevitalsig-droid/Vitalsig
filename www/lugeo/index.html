<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUGEO - Dimensión Preventiva</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .btn-exportar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: #0f2027;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.2s ease;
        }
        .btn-exportar:hover {
            background-color: #203a43;
        }
        /* Ajuste visual do popup Leaflet */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 4px;
        }
        .popup-container {
            font-family: Arial, sans-serif;
            font-size: 13px;
            max-width: 280px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }
    </style>
</head>
<body>

    <button class="btn-exportar" onclick="exportarLugeo()">Exportar Mapa (LUGEO_AAAAMMDD_HHMM)</button>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Dados da Amostra (Exemplo com campos brutos)
        const dadosAmostra = [
            {
                "Amostra": "CELLPROGRESS II",
                "Orientação Triagem (OMS)": "\u0000 O\u0000b\u0000e\u0000s\u0000i\u0000d\u0000a\u0000d\u0000e\u0000",
                "Entorno Ecológico": "\u0000 A\u0000r\u0000 \u0000U\u0000r\u0000b\u0000a\u0000n\u0000o\u0000",
                "Latitude": -22.8808,
                "Longitude": -42.1025,
                "Fator Interferente 1": "Declaro que concordo com os Termos...",
                "Fatores Interferentes (Completo)": "Sedentarismo, Alta Exposição UV"
            }
        ];

        // 2. Inicialização do Mapa
        const map = L.map('map').setView([-22.8808, -42.1025], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Função para remover caracteres nulos Unicode e espaços excessivos
        function limparTexto(texto) {
            if (typeof texto !== 'string') return texto;
            return texto.replace(/\u0000/g, '').replace(/\s+/g, ' ').trim();
        }

        // 4. Regra de classificação para a etiqueta
        function classificarPaciente(row) {
            return {
                label: "Triagem Concluída",
                color: "#28a745"
            };
        }

        // 5. Renderização dos Marcadores e Popups Sanitizados
        dadosAmostra.forEach((row) => {
            if (!row.Latitude || !row.Longitude) return;

            let classificacao = classificarPaciente(row);

            let conteudoPopup = `<div class="popup-container">
                <b style="color:#0f2027; font-size: 14px;">${limparTexto(row["Amostra"] || "Amostra")}</b><br>
                <span style="display:inline-block; margin-top:4px; padding:2px 6px; background:${classificacao.color}; color:#fff; font-size:11px; border-radius:4px; font-weight:bold;">
                    ${classificacao.label}
                </span>
                <hr style="margin: 8px 0; border: 0; border-top: 1px solid #ccc;">`;

            for (let campo in row) {
                // Filtra campos de localização e redundâncias repetitivas
                if (campo === "Latitude" || campo === "Longitude" || campo.startsWith("Fator Interferente ")) {
                    continue;
                }

                if (row[campo] !== undefined && row[campo] !== null && row[campo] !== "") {
                    let valorLimpo = limparTexto(String(row[campo]));
                    conteudoPopup += `<b>${campo}:</b> ${valorLimpo}<br>`;
                }
            }

            conteudoPopup += `<hr style="margin: 5px 0; border: 0; border-top: 1px solid #ccc;">
                <small style="color:#777;">VITALSig.info - Dimensión Preventiva</small>
            </div>`;

            L.marker([row.Latitude, row.Longitude])
                .addTo(map)
                .bindPopup(conteudoPopup);
        });

        // 6. Função de Exportação com o formato LUGEO_AAAAMMDD_HHMM
        function exportarLugeo() {
            const agora = new Date();
            const ano = agora.getFullYear();
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const dia = String(agora.getDate()).padStart(2, '0');
            const hora = String(agora.getHours()).padStart(2, '0');
            const minuto = String(agora.getMinutes()).padStart(2, '0');

            const nomeArquivo = `LUGEO_${ano}${mes}${dia}_${hora}${minuto}.html`;

            const conteudoHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([conteudoHtml], { type: "text/html;charset=utf-8" });
            const link = document.createElement("a");

            link.href = URL.createObjectURL(blob);
            link.download = nomeArquivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
